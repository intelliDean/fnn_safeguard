[package]
name = "fnn-safeguard"
version = "0.1.0"
edition = "2024"
authors = ["Fiber Operator Community"]
description = "Verified Recovery Points and Pre-Upgrade Qualification for Fiber Network Nodes"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
sha2 = "0.10"
hex = "0.4"
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }
tempfile = "3.10"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
