name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install official clean FNN v0.9.0 release binary
        run: |
          mkdir -p bin
          curl -fL -o fnn_v0.9.0-x86_64-linux.tar.gz https://github.com/nervosnetwork/fiber/releases/download/v0.9.0/fnn_v0.9.0-x86_64-linux.tar.gz
          echo "ab8591065d64474735b4812cff9131869caed9b26179470def84a9c98cdd4432  fnn_v0.9.0-x86_64-linux.tar.gz" | sha256sum -c -
          tar -xzf fnn_v0.9.0-x86_64-linux.tar.gz -C bin fnn
          chmod +x bin/fnn
          echo "9c71faea17fa605cf0f1c5a3574bd91f408971c8142d82d0d0249ee082dee1b5  bin/fnn" | sha256sum -c -
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          bin/fnn --version
          rm -f fnn_v0.9.0-x86_64-linux.tar.gz

      - name: Run Test Suite
        run: cargo test --all --verbose
